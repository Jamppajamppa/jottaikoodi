<!DOCTYPE html>
<html lang="fi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Opiskelijan tiedot ja arvosanat</title>
    <link rel="stylesheet" href="styles.css">   
</head>
<body>
    <input type ="text" id="name" placeholder="Syötä opiskelijan nimi"><br>
    <input type ="number" id="age" placeholder="Syötä opiskelijan ikä"><br>
    <input type ="text" id="course" placeholder="Syötä opiskelijan kurssi"><br>
    <input type ="text" id="grade" placeholder="Syötä opiskelijan arvosana"><br><br>
    <button onclick="addStudent()">Lisää opiskelija</button>

    <h1>Opiskelija lista</h1>
    <table>
        <thead>
        <tr>
            <th>Nimi</th>
            <th>Ikä</th>
            <th>Kurssi</th>
            <th>Arvosana</th>
        </tr>
</thead>
<tbody id="studentList"></tbody>
    </table>
</body>
<script src="script.js"></script>

</html>
